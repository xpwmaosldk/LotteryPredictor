    </div>
    <div class="progress-container">

  <script>
    (function () {
      // 6개 로또 볼 랜덤 번호 생성 및 공식 색상 설정
      function getSplashBallColor(num) {
        if (num <= 10) return '#FBC400'; // 1~10: 노랑
        if (num <= 20) return '#69C8F2'; // 11~20: 파랑
        if (num <= 30) return '#FF7272'; // 21~30: 빨강
        if (num <= 40) return '#AAAAAA'; // 31~40: 회색
        return '#B0D840';                // 41~45: 초록
      }

      var randomNumbers = [];
      while (randomNumbers.length < 6) {
        var n = Math.floor(Math.random() * 45) + 1;
        if (randomNumbers.indexOf(n) === -1) {
          randomNumbers.push(n);
        }
      }
      randomNumbers.sort(function (a, b) { return a - b; });

      var balls = document.querySelectorAll('.balls-mixer .lotto-ball');
      for (var i = 0; i < balls.length && i < randomNumbers.length; i++) {
        balls[i].textContent = randomNumbers[i];
        balls[i].style.backgroundColor = getSplashBallColor(randomNumbers[i]);
      }

      var progress = 0;
      var progressBar = document.getElementById('progress-bar');
      var statusText = document.getElementById('loading-status');

      var interval = setInterval(function () {
        if (progress < 90) {
          progress += Math.random() * 8;
          if (progress > 90) progress = 90;
          updateProgress(progress);
        }
      }, 200);

      function updateProgress(value) {
        var rounded = Math.round(value);
        if (progressBar) progressBar.style.width = rounded + '%';
        if (statusText) statusText.innerText = 'Wasm Engine Loading (' + rounded + '%)';
      }

      window.addEventListener('flutter-first-frame', function () {
        clearInterval(interval);
        updateProgress(100);
        setTimeout(function () {
          var container = document.getElementById('loading-container');
          if (container) {
            container.classList.add('fade-out');
            setTimeout(function () {
              container.remove();
            }, 500);
          }
        }, 200);
      });
    })();
  </script>

      function getOrCreateVideo() {
        if (!keepAwakeVideo) {
          keepAwakeVideo = document.createElement('video');
          keepAwakeVideo.id = 'cld-keep-awake-video';
          keepAwakeVideo.setAttribute('title', 'CLDLotto Keep Awake');
          keepAwakeVideo.setAttribute('playsinline', '');
          keepAwakeVideo.setAttribute('webkit-playsinline', '');
          keepAwakeVideo.setAttribute('loop', '');
          keepAwakeVideo.muted = true;
          keepAwakeVideo.volume = 0;
          keepAwakeVideo.style.position = 'fixed';
          keepAwakeVideo.style.top = '0';
          keepAwakeVideo.style.left = '0';
          keepAwakeVideo.style.width = '1px';
          keepAwakeVideo.style.height = '1px';
          keepAwakeVideo.style.opacity = '0.001';
          keepAwakeVideo.style.pointerEvents = 'none';
          keepAwakeVideo.style.zIndex = '-9999';

          var sourceMp4 = document.createElement('source');
          sourceMp4.src = MP4_BASE64;
          sourceMp4.type = 'video/mp4';
          keepAwakeVideo.appendChild(sourceMp4);

          document.body.appendChild(keepAwakeVideo);
        }
        return keepAwakeVideo;
      }

      function requestWakeLock() {
        if ('wakeLock' in navigator && typeof navigator.wakeLock.request === 'function') {
          navigator.wakeLock.request('screen').then(function (sentinel) {
            wakeLockSentinel = sentinel;
            sentinel.addEventListener('release', function () {
              wakeLockSentinel = null;
              if (keepAwakeActive && document.visibilityState === 'visible') {
                requestWakeLock();
              }
            });
          }).catch(function (err) {
            // WakeLock API 실패 시에도 보이지 않는 미디어 루프 재생으로 화면 꺼짐 방지가 유지됨
          });
        }
      }

      window.cldKeepAwakeEnable = function () {
        keepAwakeActive = true;
        try {
          var vid = getOrCreateVideo();
          var playPromise = vid.play();
          if (playPromise !== undefined) {
            playPromise.catch(function (err) {
              console.warn('Keep-awake media play warning:', err);
            });
          }
        } catch (e) {
          console.warn('Keep-awake video error:', e);
        }
        requestWakeLock();
        return true;
      };

      window.cldKeepAwakeDisable = function () {
        keepAwakeActive = false;
        try {
          if (keepAwakeVideo) {
            keepAwakeVideo.pause();
          }
        } catch (_) { }
        if (wakeLockSentinel) {
          try {
            wakeLockSentinel.release();
          } catch (_) { }
          wakeLockSentinel = null;
        }
        return true;
      };

      window.cldIsKeepAwakeActive = function () {
        return keepAwakeActive;
      };

      document.addEventListener('visibilitychange', function () {
        if (keepAwakeActive && document.visibilityState === 'visible') {
          try {
            if (keepAwakeVideo && keepAwakeVideo.paused) {
              keepAwakeVideo.play().catch(function () { });
            }
          } catch (_) { }
          if (!wakeLockSentinel) {
            requestWakeLock();
          }
        }
      });
    })();

        // 다국어 텍스트 반영
        var titleEl = document.getElementById('paypal-title-text');
        var subEl = document.getElementById('paypal-sub-text');
        var footerEl = document.getElementById('paypal-footer-text');
        if (lang === 'en') {
          if (titleEl) titleEl.innerText = 'Support Developer (PayPal)';
          if (subEl) subEl.innerHTML = 'Enjoying the 3D Physics Lottery Simulator?<br>Buying the developer a coffee helps keep the servers running and supports continuous updates!';

        if (!isPaypalRendered) {
          if (window.paypal && typeof window.paypal.HostedButtons === 'function') {

              window.paypal.HostedButtons({
                hostedButtonId: "HNBNUKCLZRXXE",

      window.cldClosePaypalDonation = function () {
        var modal = document.getElementById('paypal-donation-modal');

          modal.classList.remove('show');

      };

        if (e.key === 'Escape') {
