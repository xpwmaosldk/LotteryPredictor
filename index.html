  <script>
    (function () {
      var titleWrap = document.querySelector('.loader-title');
      var brandKoEl = document.getElementById('loader-brand-ko');
      var brandEnEl = document.getElementById('loader-brand-en');
      if (!/^ko/i.test(navigator.language || '')) {
        if (titleWrap) titleWrap.setAttribute('aria-label', 'LuckPick');
        if (brandKoEl) brandKoEl.style.display = 'none';
        if (brandEnEl) brandEnEl.style.display = 'block';
      }
      // 6개 로또 볼 랜덤 번호 생성 및 공식 색상 설정
      function getSplashBallColor(num) {
        if (num <= 10) return '#FBC400'; // 1~10: 노랑
        if (num <= 20) return '#69C8F2'; // 11~20: 파랑
        if (num <= 30) return '#FF7272'; // 21~30: 빨강
        if (num <= 40) return '#AAAAAA'; // 31~40: 회색
        return '#B0D840';                // 41~45: 초록
      }

      var randomNumbers = [];
      while (randomNumbers.length < 6) {
        var n = Math.floor(Math.random() * 45) + 1;
        if (randomNumbers.indexOf(n) === -1) {
          randomNumbers.push(n);
        }
      }
      randomNumbers.sort(function (a, b) { return a - b; });

      var balls = document.querySelectorAll('.balls-mixer .lotto-ball');
      for (var i = 0; i < balls.length && i < randomNumbers.length; i++) {
        balls[i].textContent = randomNumbers[i];
        balls[i].style.backgroundColor = getSplashBallColor(randomNumbers[i]);
      }

      var progress = 0;
      var progressBar = document.getElementById('progress-bar');
      var statusText = document.getElementById('loading-status');

      var interval = setInterval(function () {
        if (progress < 90) {
          progress += Math.random() * 8;
          if (progress > 90) progress = 90;
          updateProgress(progress);
        }
      }, 200);

      function updateProgress(value) {
        var rounded = Math.round(value);
        if (progressBar) progressBar.style.width = rounded + '%';
        if (statusText) statusText.innerText = 'Wasm Engine Loading (' + rounded + '%)';
      }

      window.addEventListener('flutter-first-frame', function () {
        clearInterval(interval);
        updateProgress(100);
        setTimeout(function () {
          var container = document.getElementById('loading-container');
          if (container) {
            container.classList.add('fade-out');
            setTimeout(function () {
              container.remove();
            }, 500);
          }
        }, 200);
      });
    })();
  </script>

        if ('wakeLock' in navigator && typeof navigator.wakeLock.request === 'function') {
          navigator.wakeLock.request('screen').then(function (sentinel) {
            wakeLockSentinel = sentinel;
            sentinel.addEventListener('release', function () {
              wakeLockSentinel = null;
              if (keepAwakeActive && document.visibilityState === 'visible') {
                requestWakeLock();
              }
            });
          }).catch(function (err) {
            // WakeLock API 실패 시에도 보이지 않는 미디어 루프 재생으로 화면 꺼짐 방지가 유지됨
          });
        }
      }

      window.cldKeepAwakeEnable = function () {
        keepAwakeActive = true;
        try {
          var vid = getOrCreateVideo();
          var playPromise = vid.play();
          if (playPromise !== undefined) {
            playPromise.catch(function (err) {
              console.warn('Keep-awake media play warning:', err);
            });
          }
        } catch (e) {
          console.warn('Keep-awake video error:', e);
        }
        requestWakeLock();
        return true;
      };

      window.cldKeepAwakeDisable = function () {
        keepAwakeActive = false;
        try {
          if (keepAwakeVideo) {
            keepAwakeVideo.pause();
          }
        } catch (_) { }
        if (wakeLockSentinel) {
          try {
            wakeLockSentinel.release();
          } catch (_) { }
          wakeLockSentinel = null;
        }
        return true;
      };

      window.cldIsKeepAwakeActive = function () {
        return keepAwakeActive;
      };

      document.addEventListener('visibilitychange', function () {
        if (keepAwakeActive && document.visibilityState === 'visible') {
          try {
            if (keepAwakeVideo && keepAwakeVideo.paused) {
              keepAwakeVideo.play().catch(function () { });
            }
          } catch (_) { }
          if (!wakeLockSentinel) {
            requestWakeLock();
          }
        }
      });
    })();
  </script>

  <script>
    (function () {
      var isPaypalRendered = false;
      var selectedAmount = 3;

      window.cldSetDonationAmount = function (amount) {
        selectedAmount = amount;
        var chips = document.querySelectorAll('.preset-chip');
        chips.forEach(function (chip) {
          if (parseInt(chip.getAttribute('data-amount'), 10) === amount) {
            chip.classList.add('active');
          } else {
            chip.classList.remove('active');
          }
        });

        var input = document.getElementById('amount');
        if (input) {
          input.value = amount;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
          input.dispatchEvent(new Event('keyup', { bubbles: true }));
        }
      };

      function tryRenderPaypalButton() {
        if (isPaypalRendered) return;
        var container = document.getElementById('paypal-container-HNBNUKCLZRXXE');
        var loadingEl = document.getElementById('paypal-sdk-loading');

        if (window.paypal && typeof window.paypal.HostedButtons === 'function') {
          try {
            window.paypal.HostedButtons({
              hostedButtonId: "HNBNUKCLZRXXE",
            }).render("#paypal-container-HNBNUKCLZRXXE").then(function () {
              isPaypalRendered = true;
              if (loadingEl) loadingEl.style.display = 'none';

              var form = container ? container.querySelector('form') : null;
              if (form) {
                form.setAttribute('target', '_blank');
              }

              window.cldSetDonationAmount(selectedAmount);
            }).catch(function (err) {
              console.error('PayPal render error:', err);
              if (loadingEl) {
                loadingEl.innerHTML = 'PayPal 임베디드 결제 연결이 지연되고 있습니다.<br>아래 [PayPal로 직접 후원하기]를 이용해 주세요.';
              }
            });
          } catch (err) {
            console.error('PayPal button render exception:', err);
            if (loadingEl) {
              loadingEl.innerHTML = 'PayPal 임베디드 결제 연결이 지연되고 있습니다.<br>아래 [PayPal로 직접 후원하기]를 이용해 주세요.';
            }
          }
        } else {
          setTimeout(function () {
            if (!isPaypalRendered && window.paypal && typeof window.paypal.HostedButtons === 'function') {
              tryRenderPaypalButton();
            } else if (!isPaypalRendered && loadingEl) {
              loadingEl.innerHTML = '브라우저 설정(광고 차단 등)으로 PayPal 모듈이 지연되고 있습니다.<br>아래 [PayPal로 직접 후원하기] 버튼을 이용해 주세요.';
            }
          }, 1800);
        }
      }

      window.cldOpenPaypalDonation = function (lang) {
        var modal = document.getElementById('paypal-donation-modal');
        if (!modal) return false;

        // 다국어 텍스트 반영
        var titleEl = document.getElementById('paypal-title-text');
        var subEl = document.getElementById('paypal-sub-text');
        var footerEl = document.getElementById('paypal-footer-text');
        var directLinkText = document.getElementById('paypal-direct-link-text');

        if (lang === 'en') {
          if (titleEl) titleEl.innerText = 'Support Developer (PayPal)';
          if (subEl) subEl.innerHTML = 'Enjoying LuckPick?<br>Buying the developer a coffee helps keep the servers running and supports continuous updates!';
          if (footerEl) footerEl.innerText = 'Donation is securely processed via PayPal.';
          if (directLinkText) directLinkText.innerText = '☕ Donate via PayPal directly (New Tab)';
        } else {
          if (titleEl) titleEl.innerText = '개발자 후원하기 (PayPal)';
          if (subEl) subEl.innerHTML = '복뽑기가 유익하셨나요?<br>따뜻한 커피 한 잔의 후원이 서버 유지와 지속적인 업데이트에 큰 힘이 됩니다!';
          if (footerEl) footerEl.innerText = 'PayPal의 안전한 보안 결제 시스템을 통해 기부됩니다.';
          if (directLinkText) directLinkText.innerText = '☕ PayPal로 직접 후원하기 (새 창)';
        }

        modal.classList.add('show');

        // PayPal Hosted Buttons 최초 렌더링
        tryRenderPaypalButton();

        // 렌더링 완료된 상태라면 기본 금액 갱신
        if (isPaypalRendered) {
          window.cldSetDonationAmount(selectedAmount);
        }

        return true;
      };

      window.cldClosePaypalDonation = function () {
        var modal = document.getElementById('paypal-donation-modal');
        if (modal) {
          modal.classList.remove('show');
        }
        return true;
      };

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          window.cldClosePaypalDonation();
        }
      });
    })();
  </script>
