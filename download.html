<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 6/45 3D 물리 시뮬레이터 다운로드</title>
  <script>
    (function () {
      var ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.xpwmaosldk.lotto';
      // TODO: iOS 앱스토어 출시 후 아래 주소를 'https://apps.apple.com/app/idXXXXXXXXXX' 로 교체하세요.
      var IOS_STORE_URL = 'https://xpwmaosldk.github.io/LotteryPredictor/';

      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      var targetUrl = isIOS ? IOS_STORE_URL : (isAndroid ? ANDROID_STORE_URL : ANDROID_STORE_URL);
      window.location.replace(targetUrl);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #140F0C;
      color: #FAF7F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 18px;
      background: #221A15;
      border: 1px solid #3D3027;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 10px;
      color: #E5B05C;
    }

    p {
      font-size: 13.5px;
      color: #C4B9AC;
      margin: 0 0 20px;
      line-height: 1.5;
    }

    a.btn {
      display: block;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-android {
      background: #E5B05C;
      color: #140F0C;
    }

    .btn-ios {
      background: #332720;
      color: #FAF7F2;
      border: 1px solid #4A382C;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>스토어로 이동 중입니다...</h1>
    <p>자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>
    <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.xpwmaosldk.lotto">Google Play
      (Android)</a>
    <a class="btn btn-ios" href="https://xpwmaosldk.github.io/LotteryPredictor/">iOS / 웹 시뮬레이터 열기</a>
  </div>
</body>

</html>
